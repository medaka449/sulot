document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});

const KEY="koyaku-counter-v3",OLD_KEY="koyaku-counter-v2",DEFAULT_COUNTERS=["ベル","スイカ","チェリー"],DEFAULT_MACHINES=["マイジャグラーV","アイムジャグラーEX","その他"];
let minusMode=false;
let inputMode=false;
let entryMode="counter";

function blankData(){return {games:0,startGames:0,counters:DEFAULT_COUNTERS.map(name=>({name,count:0})),layout:'2',memo:'',layoutNumber:'',layoutNumberHistory:[]}}
function normalizeData(d){
  d.games=Number(d.games)||0;d.startGames=Number(d.startGames)||0;
  d.counters=(Array.isArray(d.counters)?d.counters:DEFAULT_COUNTERS.map(name=>({name,count:0}))).map(c=>({name:String(c.name||'小役'),count:Number(c.count)||0,color:String(c.color||''),countMethod:String(c.countMethod||'プッシュ'),countFormula:String(c.countFormula||''),gameFormula:String(c.gameFormula||''),displayFormat:['fraction','percent'].includes(c.displayFormat)?c.displayFormat:'fraction',settingRates:Array.from({length:6},(_,i)=>String(Array.isArray(c.settingRates)?(c.settingRates[i]??''):(c.settingRates&&typeof c.settingRates==='object'?c.settingRates[i+1]??'':''))),zeroCountGuess:c.zeroCountGuess!==false,countOnly:c.countOnly===true,includeTrend:c.includeTrend!==false,alias:String(c.alias||'')}));
  if(!['2','1','first1','first2','first2four3','first2four3five1','memo'].includes(d.layout)) d.layout='first2four3';
  d.memo=String(d.memo||'');
  d.layoutNumber=String(d.layoutNumber??'');
  d.layoutNumberHistory=Array.isArray(d.layoutNumberHistory)?d.layoutNumberHistory:[];
  return d;
}
function normalizeMachine(m){
  if(!m.modes){m.modes={通常:{games:Number(m.games)||0,startGames:Number(m.startGames)||0,counters:(m.counters||DEFAULT_COUNTERS.map(name=>({name,count:0}))).map(c=>({name:c.name,count:Number(c.count)||0}))}}}
  if(!m.modes || !Object.keys(m.modes).length)m.modes={通常:blankData()};
  Object.keys(m.modes).forEach(k=>normalizeData(m.modes[k]));
  if(!Array.isArray(m.modeOrder))m.modeOrder=Object.keys(m.modes);
  m.modeOrder=m.modeOrder.filter(k=>m.modes[k]);
  Object.keys(m.modes).forEach(k=>{if(!m.modeOrder.includes(k))m.modeOrder.push(k)});
  const allowed=(Array.isArray(m.settingLevels)?m.settingLevels:[]).map(Number).filter(n=>[1,2,3,4,5,6].includes(n));
  m.settingLevels=[...new Set(allowed)].sort((a,b)=>a-b);
  if(!m.settingLevels.length)m.settingLevels=[1,2,3,4,5,6];
  delete m.games;delete m.startGames;delete m.counters;

function resolveCounterValue(data,counter,stack=[]){
  if(!counter)return 0;
  const name=String(counter.name||'');
  if(stack.includes(counter)||stack.includes(name))return Number(counter.count)||0;
  const formula=String(counter.countFormula||'').trim();
  if(String(counter.countMethod||'プッシュ')==='計算式' && formula){
    const result=evalFormula(data,formula,counter,[...stack,counter,name]);

  }
  return Number(counter.count)||0;
}
function evalFormula(data,formula,counter,stack=[]){
  const games=Number(data?.games)||0;
  const start=Number(data?.startGames)||0;
  let expr=String(formula||'').trim();
  if(!expr)return 0;
  expr=expr.replace(/総ゲーム\s*[-−－ー]\s*打ち始めゲーム数/g,'(総ゲーム-打ち始めゲーム数)');
  const values={};
  (data?.counters||[]).forEach(c=>{
    const v=resolveCounterValue(data,c,stack);
    values[String(c.name)]=v;
    if(c.alias)values[String(c.alias)]=v;
  });
  values['総ゲーム']=games;values['打ち始め']=start;values['総ゲーム数']=games;values['打ち始めゲーム数']=start;
  values['小役数']=Number(counter?.count)||0;
  Object.keys(values).sort((a,b)=>b.length-a.length).forEach(k=>{const esc=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');expr=expr.replace(new RegExp(esc,'g'),String(values[k]))});
  expr=expr.replace(/[×✕xX]/g,'*').replace(/÷/g,'/').replace(/[−－ー]/g,'-').replace(/[＋]/g,'+').replace(/[^0-9+\-*/(). ]/g,'');
  if(!expr)return 0;
  try{const v=Function('return ('+expr+')')();return Number.isFinite(v)?v:0}catch(e){return 0}
}

function effectiveCount(data,counter){
  if(!counter)return 0;
  const formula=String(counter.countFormula||'').trim();
  if(String(counter.countMethod||'プッシュ')==='計算式' && formula){
    const result=calcCountFormula(data,counter);

  }
  return Number(counter.count)||0;
}
function rate(n,data,counter){
  const count=counter?effectiveCount(data,counter):Number(n)||0;
  if(count===0)return counter?.displayFormat==='percent'?'0.00%':'1/0.00';
  const formula=String(counter?.gameFormula||'').trim();
  let denominator=Number(data?.games)||0;
  if(formula)denominator=calcGameFormula(data,counter);
  if(!Number.isFinite(denominator)||denominator<=0)return counter?.displayFormat==='percent'?'0.00%':'1/0.00';

}

function machineDefinitionForJson(machine){
  const m=JSON.parse(JSON.stringify(normalizeMachine(machine)));
  Object.keys(m.modes||{}).forEach(mode=>{
    const d=normalizeData(m.modes[mode]);
    d.games=0;d.startGames=0;d.layoutNumberHistory=[];
    d.counters=(d.counters||[]).map(c=>({...c,count:0}));
    m.modes[mode]=d;
  });
  return m;
}
function mergeMachineDefinition(def,existing){
  const imported=normalizeMachine(JSON.parse(JSON.stringify(def)));
  if(!existing)return imported;
  const old=normalizeMachine(JSON.parse(JSON.stringify(existing)));
  Object.keys(imported.modes||{}).forEach(mode=>{
    const nd=normalizeData(imported.modes[mode]);
    const od=old.modes?.[mode]?normalizeData(old.modes[mode]):null;
    if(od){
      nd.games=Number(od.games)||0;nd.startGames=Number(od.startGames)||0;
      if(nd.layout==='memo')nd.memo=od.memo||'';
      const oldByName={};(od.counters||[]).forEach(c=>{oldByName[String(c.name)]=c});
      nd.counters=(nd.counters||[]).map(c=>({...c,count:Number(oldByName[String(c.name)]?.count)||0}));
    }
    imported.modes[mode]=nd;
  });
  if(state.machines?.[BIOHAZARD_RE3_MACHINE]===existing){
    // 古いクラウド設定が削除済みモードを復活させないようにする。
    delete imported.modes['AT中のCZ'];
    if(!imported.modes['CZ'] && old.modes['CZ'])imported.modes['CZ']=old.modes['CZ'];
    if(imported.modes['CZ'] && old.modes['CZ']){
      imported.modes['CZ'].czEntries=JSON.parse(JSON.stringify(old.modes['CZ'].czEntries||[]));
      imported.modes['CZ'].bioCzTableInitialized=true;
    }
    imported.modeOrder=['通常','フィギュア','CZ'].filter(name=>imported.modes[name]);
  }
  return imported;
}

function importMachineJson(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const payload=JSON.parse(String(reader.result||''));
      if(payload?.format!=='koyaku-machine-definitions'||!payload?.machines||typeof payload.machines!=='object')throw new Error('format');
      const names=Object.keys(payload.machines);
      if(!names.length)throw new Error('empty');
      const imported={};names.forEach(name=>{
        const clean=String(name).trim();
        if(clean)imported[clean]=mergeMachineDefinition(payload.machines[name],state.machines?.[clean]);

}

function deleteMode(machineName,mode){
  const machine=state.machines[machineName];
  if(!machine||!machine.modes[mode])return;
  if(mode==='通常'){alert('「通常」は基本モードのため削除できません');return}
  const modeNames=Object.keys(machine.modes);
  if(modeNames.length<=1){alert('モードは1つ以上必要です');return}
  if(!confirm(`「${mode}」を削除しますか？`))return;

  // 削除前の編集状態を保持
  const wasEditing=modeEditActive;

  // データと並び順から完全に削除
  delete machine.modes[mode];
  machine.modeOrder=(machine.modeOrder||Object.keys(machine.modes)).filter(x=>x!==mode&&machine.modes[x]);

  // 表示中のモードを安全に次のモードへ移動
  const remainingModes=(machine.modeOrder.length?machine.modeOrder:Object.keys(machine.modes)).filter(x=>machine.modes[x]);
  if(state.selected===machineName&&!remainingModes.includes(displayMode)){
    displayMode=remainingModes[0]||'通常';
  }

  save();

  // 本体・モード切替・機種管理画面をすべて即時更新
  renderMachineSelect();
  renderModeSwitch();
  if(state.selected===machineName)render();

  // 「機種を管理」画面を開いたまま、削除した行が確実に消えるよう再描画
  if(state.selected===machineName){
    openModeSettings(machineName);
    if(wasEditing) toggleModeEdit();
  }
}

function parseSettingRate(raw,counter){
  let v=String(raw??'').trim().replace(/％/g,'%').replace(/,/g,'');
  if(!v)return 0;
  const isPercent=String(counter?.displayFormat||'fraction')==='percent' || v.includes('%');

  return isPercent?n:1/n;
}

 const nav=document.createElement('div');nav.className='incomeCalendarNav';

 const summary=document.createElement('div');summary.className='incomeMonthTotal';const sum=Object.entries(totals).filter(([date])=>date.startsWith(incomeCalendarMonth+'-')).reduce((a,[,v])=>a+v,0);summary.textContent='全機種の月間収支 '+incomeMoney(sum);root.append(summary);

 const selected=document.createElement('div');selected.className='incomeSelectedTotal';selected.textContent=draft.date+' の合計 '+incomeMoney(totals[draft.date]||0);root.append(selected);
 for(const [name,machine] of Object.entries(state.machines||{}))for(const r of machine.incomeRecords||[]){if(r.date!==draft.date)continue;const row=document.createElement('div');row.className='historyRow';row.textContent=name+'　'+incomeMoney(r.returned-r.investment);root.append(row);}

/* Cloud machine-definition sync: public read; authenticated write on PC only. */
const CLOUD_REPO='medaka449/sulot',CLOUD_FILE='machines-sync.json',CLOUD_API='https://api.github.com/repos/'+CLOUD_REPO+'/contents/'+CLOUD_FILE;
const CLOUD_TOKEN_KEY='koyaku-cloud-pat-local',CLOUD_SEND_KEY='koyaku-cloud-send';
let cloudBusy=false,cloudTimer=null,cloudLastSent='',cloudApplying=false;
function cloudPayload(){const machines={};Object.keys(state.machines||{}).forEach(n=>machines[n]=machineDefinitionForJson(state.machines[n]));return {format:'koyaku-machine-definitions',version:1,machines};}
function cloudStatus(msg){const e=document.getElementById('cloudSyncStatus');if(e)e.textContent=msg;}
function cloudUtf8ToBase64(s){const bytes=new TextEncoder().encode(s);let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(binary);}
function cloudBase64ToUtf8(s){const bytes=Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0));return new TextDecoder().decode(bytes);}
async function cloudFetch(){
 const res=await fetch(CLOUD_API+'?t='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
 if(res.status===404)return null;if(!res.ok)throw Error('取得 HTTP '+res.status);
 const j=await res.json();return {sha:j.sha,payload:JSON.parse(cloudBase64ToUtf8(j.content))};
}
async function cloudPull(silent=false){
 if(cloudBusy)return;cloudBusy=true;
 try{
  const remote=await cloudFetch();if(!remote){cloudStatus('クラウドに機種設定がまだありません');return;}
  const p=remote.payload;if(p.format!=='koyaku-machine-definitions'||!p.machines||typeof p.machines!=='object')throw Error('設定形式が違います');
  let changed=0;cloudApplying=true;
  for(const [name,def] of Object.entries(p.machines)){
   if(!name.trim()||!def||typeof def!=='object')continue;
   const next=mergeMachineDefinition(def,state.machines[name]);
   if(JSON.stringify(next)!==JSON.stringify(state.machines[name])){state.machines[name]=next;changed++;}
  }
  localStorage.setItem(KEY,JSON.stringify(state));cloudLastSent=JSON.stringify(cloudPayload());
  if(changed){render();if(document.getElementById('machineListScreen').style.display!=='none')showMachineListScreen();}
  cloudStatus('受信完了：'+Object.keys(p.machines).length+'機種（変更 '+changed+'）');
 }catch(e){cloudStatus('受信失敗：'+e.message);if(!silent)alert('同期できませんでした：'+e.message)}
 finally{cloudApplying=false;cloudBusy=false;}
}
async function cloudPush(){
 if(cloudBusy||!localStorage.getItem(CLOUD_SEND_KEY))return;
 const token=localStorage.getItem(CLOUD_TOKEN_KEY)||'';if(!token)return;
 const payload=cloudPayload(),fingerprint=JSON.stringify(payload);
 if(fingerprint===cloudLastSent)return;
 cloudBusy=true;cloudStatus('機種設定を送信中…');
 try{
  for(let attempt=0;attempt<2;attempt++){
   const get=await fetch(CLOUD_API+'?t='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token}});
   if(!get.ok&&get.status!==404)throw Error('確認 HTTP '+get.status);
   const current=get.status===404?null:await get.json();
   const body={message:'Sync machine definitions from counter',content:cloudUtf8ToBase64(JSON.stringify(payload,null,2)),branch:'main'};
   if(current)body.sha=current.sha;
   const put=await fetch(CLOUD_API,{method:'PUT',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
   if(put.ok){cloudLastSent=fingerprint;cloudStatus('送信完了：'+new Date().toLocaleTimeString('ja-JP'));return;}
   if(put.status===409&&attempt===0)continue;
   throw Error('送信 HTTP '+put.status+(put.status===401||put.status===403?'（トークン権限を確認）':''));
  }
 }catch(e){cloudStatus('送信失敗：'+e.message)}
 finally{cloudBusy=false;}
}
function cloudSchedule(){if(cloudApplying||!localStorage.getItem(CLOUD_SEND_KEY))return;clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudPush,2500);}
function cloudControls(){
 const screen=document.getElementById('machineListScreen');if(screen.querySelector('#cloudSyncPanel'))return;
 const panel=document.createElement('div');panel.id='cloudSyncPanel';panel.style.cssText='margin:12px 0;padding:12px;border:1px solid #344051;border-radius:12px;color:#e5e7eb;font-size:13px';
 const title=document.createElement('div');title.textContent='機種設定の自動同期';title.style.cssText='font-weight:800;margin-bottom:8px';panel.append(title);
 const note=document.createElement('div');note.textContent='iPhoneは自動受信。PCで送信を有効にすると機種の追加・編集を自動反映。カウント・収支は同期しません。';note.style.marginBottom='8px';panel.append(note);
 const status=document.createElement('div');status.id='cloudSyncStatus';status.textContent='未確認';status.style.marginBottom='8px';panel.append(status);
 const receive=document.createElement('button');receive.textContent='今すぐ受信';receive.type='button';receive.onclick=()=>cloudPull();panel.append(receive);
 const label=document.createElement('label');label.style.cssText='display:flex;align-items:center;gap:8px;margin:10px 0';const check=document.createElement('input');check.type='checkbox';check.checked=localStorage.getItem(CLOUD_SEND_KEY)==='1';label.append(check,document.createTextNode('この端末から自動送信（PC用）'));panel.append(label);
 const token=document.createElement('input');token.type='password';token.placeholder='GitHubのFine-grained token（このPC内のみ保存）';token.autocomplete='off';token.style.cssText='width:100%;box-sizing:border-box;padding:9px;background:#101820;color:#fff;border:1px solid #465264;border-radius:8px';token.value=localStorage.getItem(CLOUD_TOKEN_KEY)||'';panel.append(token);
 const store=document.createElement('button');store.textContent='トークンをこの端末に保存';store.type='button';store.style.marginTop='7px';store.onclick=()=>{localStorage.setItem(CLOUD_TOKEN_KEY,token.value.trim());cloudStatus('トークンをこの端末に保存しました');cloudSchedule();};panel.append(store);
 const help=document.createElement('div');help.style.cssText='font-size:11px;opacity:.85;margin-top:8px';help.textContent='GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens。対象は medaka449/sulot のみ、Contents: Read and write。トークンはチャットに送らないでください。';panel.append(help);
 check.onchange=()=>{if(check.checked){if(!localStorage.getItem(CLOUD_TOKEN_KEY)){check.checked=false;alert('先にPCでトークンを保存してください');return;}localStorage.setItem(CLOUD_SEND_KEY,'1');cloudSchedule();}else{localStorage.removeItem(CLOUD_SEND_KEY);clearTimeout(cloudTimer);}cloudStatus(check.checked?'自動送信 ON':'自動受信のみ');};
 screen.append(panel);
}
const cloudOriginalSave=save;
save=function(){cloudOriginalSave();cloudSchedule();};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)cloudPull(true)});
window.addEventListener('load',()=>{cloudControls();cloudPull(true);setInterval(()=>{if(!document.hidden)cloudPull(true)},60000);});
